# Temporary proof for #42; removed before the PR is final.
name: Prove NCRB TLS fix
on:
  push:
    branches: [fix-ncrb-tls]
jobs:
  prove:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: tools/pipeline_2025}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e .[dev]
      - run: python -m pytest tests/test_tls.py -q
      - name: Fetch ncrb.gov.in with the pipeline client
        run: |
          python - <<'PY'
          from delhi_data_2025.http import SafeHttpClient
          c = SafeHttpClient('diag')
          r = c.client.get('https://ncrb.gov.in/')
          print('NCRB OK', r.status_code, len(r.content))
          PY
