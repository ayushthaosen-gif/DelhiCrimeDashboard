name: Monitor official 2025 sources
on:
  workflow_dispatch:
  schedule: [{cron: '17 5 * * 1'}]
permissions:
  contents: read
  issues: write
jobs:
  discover:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: pipeline_2025}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: pipeline_2025/pyproject.toml}
      - run: pip install -e .
      - run: python -m delhi_data_2025 discover --year 2025
      - run: python -m delhi_data_2025 report --year 2025
      - uses: actions/upload-artifact@v4
        with:
          name: source-discovery-2025
          path: |
            pipeline_2025/output/manifests/source_manifest_2025.json
            pipeline_2025/output/reports/coverage_report_2025.md
          retention-days: 30
