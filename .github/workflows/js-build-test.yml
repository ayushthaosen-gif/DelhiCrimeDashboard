name: JS build and test
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'test/**'
      - '*.html'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/js-build-test.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'test/**'
      - '*.html'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/js-build-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # Measured 2026-10-03: ~3 min on the runner, dominated by the land-use step (real polygon
    # union/difference per ward) plus the ~25 s MPD-2047 comparison. 10 minutes is ample headroom
    # while still stopping a genuinely hung job.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:site
      - run: npm run build:profiles
      - run: npm run build:interactive-map
      - run: npm run build:road-history
      - name: Verify generated output is reproducible from source
        run: |
          # every tracked file, so a newly generated page or data file cannot be left out of the check; untracked files are reported too
          if ! git diff --exit-code --stat || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo '--- files that differ from the committed versions (or are new and not committed):'
            git diff --name-only
            git ls-files --others --exclude-standard
            echo '--- first differing lines per file (trimmed):'
            git diff --unified=0 | cut -c1-200 | head -120
            exit 1
          fi
