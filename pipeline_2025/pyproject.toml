[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "delhi-data-2025"
version = "0.1.0"
description = "Auditable staging pipeline for official Delhi 2025 data"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.12", "httpx>=0.27", "lxml>=5.2", "pandas>=2.2", "pydantic>=2.7", "pypdf>=5.0", "PyYAML>=6.0", "tenacity>=9.0", "typer>=0.12"]

[project.optional-dependencies]
geo = ["geopandas>=1.0", "pyproj>=3.7", "shapely>=2.0"]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
delhi-data-2025 = "delhi_data_2025.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/delhi_data_2025"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: network reachability checks skipped by default"]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
